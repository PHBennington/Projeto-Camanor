{% load static %}
<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/scrollreveal"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{% static 'css/base.css' %}" />
    <title>{% block title %}Projeto Camanor{% endblock %}</title>
</head>
<body>
    <nav class="navbar navbar-expand-lg fixed-top bg-white shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="#">
                <img src="{% static 'img/rodapeCamanor.png' %}" alt="Logo Camanor" height="80" />
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navCamanor">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navCamanor">
                <ul class="navbar-nav mx-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="#">Início</a>
                    </li>

                    <li class="nav-item dropdown">
                        <a class="nav-link d-flex align-items-center dropdown-toggle-custom" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            Empresa
                            <i class="bi bi-chevron-down ms-1 custom-arrow"></i>
                        </a>
                        <ul class="dropdown-menu border-0 shadow">
                            <li><a class="dropdown-item" href="#">Nossa História</a></li>
                            <li><a class="dropdown-item" href="#">Campanhas Institucionais</a></li>
                            <li><a class="dropdown-item" href="#">Nossa Equipe</a></li>
                            <li><a class="dropdown-item" href="#">Aquasciente</a></li>
                        </ul>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">Estrutura</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Produtos</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Notícias</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container" style="margin-top: 100px;">
        {% block content %}{% endblock %}
    </main>

    <script>
        const isDesktop = window.innerWidth > 992;
        const sr = ScrollReveal({
            reset: false,
            duration: 1000,
            distance: '30px',
            mobile: false
        });

        sr.reveal('.navbar-brand', { origin: 'left', delay: 200 });

        if (isDesktop) {
            sr.reveal('.nav-item', {
                origin: 'top',
                interval: 200,
                delay: 400
            });
        }
    </script>
</body>
</html>
